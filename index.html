<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game">
    <div class="titlebar">
      <h1 id="title">Game Arcade</h1>
      <button id="sound" class="chip" type="button" aria-pressed="true" title="Sound on/off">🔊</button>
      <button id="fullscreen" class="chip chip--left" type="button" aria-pressed="false" title="Fullscreen">⛶</button>
    </div>

    <div id="games" class="picker"></div>
    <div id="settings" class="settings"></div>

    <p class="hint" id="hint"></p>
    <div id="scoreboard"></div>
    <p class="status" id="status"></p>
    <div id="stage" class="stage"></div>
    <div id="controls"></div>
  </main>

  <script src="ai.js"></script>
  <script src="ui.js"></script>
  <script src="audio.js"></script>
  <script src="boardgames.js"></script>
  <script src="matching.js"></script>
  <script src="snake.js"></script>
  <script src="racing.js"></script>
  <!-- three.js itself is loaded on demand by maze.js, not up front -->
  <script src="glb.js"></script>
  <script src="maze.js"></script>
  <script src="app.js"></script>
</body>
</html>
